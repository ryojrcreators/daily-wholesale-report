name: 楽天クーポンAPI 調査・発行

on:
  workflow_dispatch:
    inputs:
      store:
        description: '対象店舗（1=Americana, 2=Founder）'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
      mode:
        description: 'probe/list/detail/search/copy-preview/batch-preview=読み取り・確認のみ（安全） / copy-issue,batch-issue=⚠️実際にクーポンを発行する（confirm の入力が必須）'
        required: true
        default: 'list'
        type: choice
        options:
          - 'probe'
          - 'list'
          - 'detail'
          - 'search'
          - 'copy-preview'
          - 'copy-issue'
          - 'batch-preview'
          - 'batch-issue'
      coupon_code:
        description: 'detail/copy時に見るクーポンコード'
        required: false
        default: ''
      coupon_codes:
        description: 'batch時のクーポンコード（カンマ区切りで複数指定）'
        required: false
        default: ''
      hits:
        description: 'list時の取得件数'
        required: false
        default: '20'
      keywords:
        description: 'search時のキーワード（,区切りでOR、+区切りでAND。例: リポソーム型ビタミンC+レビュー投稿で,アルロース+レビュー投稿で）'
        required: false
        default: ''
      active_only:
        description: 'search時、現在有効期間中のクーポンだけに絞る'
        required: false
        default: false
        type: boolean
      new_start:
        description: 'copy時の新しい開始日時（例 2026-08-01T20:00:00+09:00）'
        required: false
        default: ''
      new_end:
        description: 'copy時の新しい終了日時（例 2026-08-08T01:59:59+09:00）'
        required: false
        default: ''
      no_image:
        description: 'copy時、コピー元のクーポン画像URLを除外して発行する'
        required: false
        default: false
        type: boolean
      image_url:
        description: 'copy時、指定した画像URLに差し替えて発行する（no_imageより優先）'
        required: false
        default: ''
      confirm:
        description: '⚠️ copy-issue/batch-issue を実行する場合のみ、確認のため "ISSUE" と正確に入力してください'
        required: false
        default: ''
      cw_room_id:
        description: 'batch-issue時、結果を報告するChatworkルームid'
        required: false
        default: '60101971'
      cw_mention:
        description: 'batch-issue時のChatworkメンション（例: [To:2618849]Ryo Higuchiさん）'
        required: false
        default: ''
      cw_title:
        description: 'batch-issue時のChatwork報告タイトル'
        required: false
        default: '楽天クーポン更新'
      cw_intro:
        description: 'batch-issue時のChatwork報告の冒頭メッセージ'
        required: false
        default: '下記自社製品レビュークーポンを更新しました。\nテンプレートの更新をお願いします。'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: クーポンAPI調査
        env:
          RAKUTEN_RMS_SERVICE_SECRET_1: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_1 }}
          RAKUTEN_RMS_LICENSE_KEY_1: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_1 }}
          RAKUTEN_SHOP_NAME_1: ${{ secrets.RAKUTEN_SHOP_NAME_1 }}
          RAKUTEN_RMS_SERVICE_SECRET_2: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_2 }}
          RAKUTEN_RMS_LICENSE_KEY_2: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_2 }}
          RAKUTEN_SHOP_NAME_2: ${{ secrets.RAKUTEN_SHOP_NAME_2 }}
          STORE: ${{ inputs.store }}
          CW_TOKEN: ${{ secrets.CW_TOKEN }}
          MODE: ${{ inputs.mode }}
          COUPON_CODE: ${{ inputs.coupon_code }}
          COUPON_CODES: ${{ inputs.coupon_codes }}
          HITS: ${{ inputs.hits }}
          NEW_START: ${{ inputs.new_start }}
          NEW_END: ${{ inputs.new_end }}
          KEYWORDS: ${{ inputs.keywords }}
          ACTIVE_ONLY: ${{ inputs.active_only }}
          NO_IMAGE: ${{ inputs.no_image }}
          IMAGE_URL: ${{ inputs.image_url }}
          CONFIRM: ${{ inputs.confirm }}
          CW_ROOM_ID: ${{ inputs.cw_room_id }}
          CW_MENTION: ${{ inputs.cw_mention }}
          CW_TITLE: ${{ inputs.cw_title }}
          CW_INTRO: ${{ inputs.cw_intro }}
        run: python -u rakuten_coupon_test.py
