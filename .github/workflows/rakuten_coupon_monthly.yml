name: 月次クーポン自動発行

on:
  schedule:
    # JST 10:10 に毎日実行（UTC表記）。
    # 「20日以降・平日・セール期間外」の条件を満たす日まで空振りし続ける作りなので、
    # 毎日回して最初に条件を満たした日に発行させる。
    # 他のクーポン系（レビュー10:00 / 5,0の付く日10:05）と時間をずらしている。
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（true = 実際には発行しない）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      force:
        description: '日付判定（20日以降・週末・イベント中）を無視して実行する'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      sync_template_only_for:
        description: '発行はせず、指定したクーポン名のメールテンプレートだけ最新2件から同期する（空なら通常実行）'
        required: false
        default: ''
      sync_template_only_store:
        description: 'sync_template_only_for使用時の店舗キー（americana/founder。省略時はamericana）'
        required: false
        default: ''

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ライブラリをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium || sudo apt-get install -y \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxshmfence1

      - name: 月次クーポン発行
        env:
          RAKUTEN_RMS_SERVICE_SECRET_1: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_1 }}
          RAKUTEN_RMS_LICENSE_KEY_1: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_1 }}
          RAKUTEN_RMS_SERVICE_SECRET_2: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_2 }}
          RAKUTEN_RMS_LICENSE_KEY_2: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_2 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          RAKUTEN_LISTING_SPREADSHEET_ID: ${{ secrets.RAKUTEN_LISTING_SPREADSHEET_ID }}
          CW_TOKEN: ${{ secrets.CW_TOKEN }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          LOGIN_ID_1: ${{ secrets.LOGIN_ID_1 }}
          LOGIN_PASS_1: ${{ secrets.LOGIN_PASS_1 }}
          LOGIN_ID_2: ${{ secrets.LOGIN_ID_2 }}
          LOGIN_PASS_2: ${{ secrets.LOGIN_PASS_2 }}
          # 定期実行では inputs が空になる。空のままだと「本番」と解釈されるのが
          # 分かりにくいので、定期実行時の値を明示しておく（本番発行・日付判定あり）
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE: ${{ inputs.force || 'false' }}
          SYNC_TEMPLATE_ONLY_FOR: ${{ inputs.sync_template_only_for }}
          SYNC_TEMPLATE_ONLY_STORE: ${{ inputs.sync_template_only_store }}
        run: python -u rakuten_coupon_monthly.py
