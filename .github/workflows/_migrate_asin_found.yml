name: （一時）ASIN発見分をASINありタブへ移動

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（true = 件数確認のみ、書き込みしない）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth
      - env:
          DRY_RUN: ${{ inputs.dry_run }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          RAKUTEN_SPREADSHEET_ID: ${{ secrets.RAKUTEN_SPREADSHEET_ID }}
        run: python -u _migrate_asin_found.py
