name: Yahoo出荷通知専用トークン 延命更新

# 2026-09-01、定期実行を無効化した。refresh_tokenでの更新を繰り返すたびに
# 注文系APIのセッションが劣化し、px-04102（session is shorter than another API）が
# 常時発生する状態になることが実機で確認できた（新規OAuth認可でのみ回復する）。
# つまりこのkeepalive自体が「延命」ではなく劣化を早める原因だった可能性が高い。
# ローカルPCの定期実行（7:45/11:45/15:45 PT）だけに依存し、何日も動かせない見込みが
# 立った場合のみ、手動実行（workflow_dispatch）で必要な分だけ更新する。
on:
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 実行
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_SHOP_NAME_1: ${{ secrets.YAHOO_SHOP_NAME_1 }}
          YAHOO_SELLER_ID_1: ${{ secrets.YAHOO_SELLER_ID_1 }}
          YAHOO_SHOP_NAME_2: ${{ secrets.YAHOO_SHOP_NAME_2 }}
          YAHOO_SELLER_ID_2: ${{ secrets.YAHOO_SELLER_ID_2 }}
          LOGIN_ID_1: ${{ secrets.LOGIN_ID_1 }}
          LOGIN_PASS_1: ${{ secrets.LOGIN_PASS_1 }}
          LOGIN_ID_2: ${{ secrets.LOGIN_ID_2 }}
          LOGIN_PASS_2: ${{ secrets.LOGIN_PASS_2 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          RAKUTEN_LISTING_SPREADSHEET_ID: ${{ secrets.RAKUTEN_LISTING_SPREADSHEET_ID }}
        run: python -u yahoo_order_token_keepalive.py
      - name: 失敗時にChatworkへ通知
        if: ${{ failure() }}
        env:
          CW_TOKEN: ${{ secrets.CW_TOKEN }}
        run: |
          curl -s -X POST "https://api.chatwork.com/v2/rooms/60101971/tasks" \
            -H "X-ChatWorkToken: $CW_TOKEN" \
            --data-urlencode "body=[title]Yahoo出荷通知専用トークンの延命更新が失敗しました[/title]このまま放置すると次回のYahoo出荷通知実行時に再認可が必要になる可能性があります。実行ログを確認してください: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "to_ids=2618849"
