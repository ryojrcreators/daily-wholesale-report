name: 受注ステータス ダッシュボード生成

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: '対象期間（created_time基準、何日前まで）'
        required: false
        default: '21'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ライブラリをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium || sudo apt-get install -y \
            libasound2t64 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 \
            libgtk-3-0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxshmfence1
      - name: 生成実行
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          LOGIN_ID_1: ${{ secrets.LOGIN_ID_1 }}
          LOGIN_PASS_1: ${{ secrets.LOGIN_PASS_1 }}
          LOGIN_ID_2: ${{ secrets.LOGIN_ID_2 }}
          LOGIN_PASS_2: ${{ secrets.LOGIN_PASS_2 }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '21' }}
          ORDER_MEMO_API_URL: ${{ secrets.ORDER_MEMO_API_URL }}
        run: python -u order_status_dashboard.py
      - name: アップロード
        uses: actions/upload-artifact@v4
        with:
          name: order-status-dashboard
          path: order_status_dashboard.html
