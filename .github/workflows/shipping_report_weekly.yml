name: 出荷件数レポート 週次送信（Chatwork）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（true = 集計してログ出力のみ、Chatwork送信なし）'
        required: true
        default: 'true'
  schedule:
    # GitHub Actionsのcronはサマータイムを自動追従しないため、現在（PDT、UTC-7）基準で設定。
    # 毎週金曜 LA時間(PDT) 18:00 = UTC翌日(土) 1:00（倉庫の当日バッチが締まった後）。本番実行（DRY_RUN=false）
    # 冬時間（PST、UTC-8）に切り替わったら '0 2 * * 6' に要調整。
    - cron: '0 1 * * 6'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium || sudo apt-get install -y \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxshmfence1

      - name: 週次レポート送信
        env:
          LOGIN_ID_1: ${{ secrets.LOGIN_ID_1 }}
          LOGIN_PASS_1: ${{ secrets.LOGIN_PASS_1 }}
          LOGIN_ID_2: ${{ secrets.LOGIN_ID_2 }}
          LOGIN_PASS_2: ${{ secrets.LOGIN_PASS_2 }}
          CW_TOKEN: ${{ secrets.CW_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python -u shipping_report_weekly.py

      - name: デバッグ用スクリーンショット保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: |
            *.png
            *.html
          if-no-files-found: ignore
