name: Yahoo API テスト

on:
  workflow_dispatch:
    inputs:
      item_code:
        description: '調査対象のYahoo商品コード（ItemCode）'
        required: true
      restore_quantity:
        description: 'restore時に戻す在庫数（hide実行時のログに出た元の在庫数を入れる）'
        required: false
        default: ''
      mode:
        description: 'dump=読み取りのみ（安全） / probe-edit=editItemの必須項目を調べる（変更なし） / hide・restore・publish・edit-hide-test・restore-edit=⚠️実際に商品データを変更する（confirm_item_code の入力が必須）'
        required: true
        default: 'dump'
        type: choice
        options:
          - 'dump'
          - 'probe-edit'
          - 'edit-hide-test'
          - 'restore-edit'
          - 'hide'
          - 'restore'
          - 'publish'
      confirm_item_code:
        description: '⚠️ hide/restore/publish/edit-hide-test/restore-edit を実行する場合のみ、確認のため item_code と同じ商品コードをもう一度入力してください'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Yahoo APIテスト実行
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_SHOP_NAME_1: ${{ secrets.YAHOO_SHOP_NAME_1 }}
          YAHOO_SELLER_ID_1: ${{ secrets.YAHOO_SELLER_ID_1 }}
          YAHOO_SHOP_NAME_2: ${{ secrets.YAHOO_SHOP_NAME_2 }}
          YAHOO_SELLER_ID_2: ${{ secrets.YAHOO_SELLER_ID_2 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          RAKUTEN_LISTING_SPREADSHEET_ID: ${{ secrets.RAKUTEN_LISTING_SPREADSHEET_ID }}
          TARGET_ITEM_CODE: ${{ inputs.item_code }}
          MODE: ${{ inputs.mode }}
          RESTORE_QUANTITY: ${{ inputs.restore_quantity }}
          CONFIRM_ITEM_CODE: ${{ inputs.confirm_item_code }}
        run: python yahoo_api_test.py
