name: DEBUG 仕入不可Close対象 件数把握（一時）

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 実行
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          RAKUTEN_SPREADSHEET_ID: ${{ secrets.RAKUTEN_SPREADSHEET_ID }}
          # import経路上のcase_orders_auto_close.pyがモジュール読み込み時に必須とするだけで、
          # このスクリプトでは実際には使わない（ダミー値でよい）
          LOGIN_ID_1: dummy
          LOGIN_PASS_1: dummy
          LOGIN_ID_2: dummy
          LOGIN_PASS_2: dummy
          YAHOO_CLIENT_ID: dummy
          YAHOO_CLIENT_SECRET: dummy
          GOOGLE_CREDENTIALS: dummy
          RAKUTEN_LISTING_SPREADSHEET_ID: dummy
        run: python debug_shortage_count.py
