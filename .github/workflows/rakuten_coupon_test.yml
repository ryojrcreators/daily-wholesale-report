name: 楽天クーポンAPI 調査（読み取りのみ）

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe=エンドポイント調査 / list=クーポン一覧 / detail=1件の全項目'
        required: true
        default: 'list'
        type: choice
        options:
          - 'probe'
          - 'list'
          - 'detail'
          - 'copy-preview'
          - 'copy-issue'
      coupon_code:
        description: 'detail時に見るクーポンコード'
        required: false
        default: ''
      hits:
        description: 'list時の取得件数'
        required: false
        default: '20'
      new_start:
        description: 'copy時の新しい開始日時（例 2026-08-01T20:00:00+09:00）'
        required: false
        default: ''
      new_end:
        description: 'copy時の新しい終了日時（例 2026-08-08T01:59:59+09:00）'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: クーポンAPI調査
        env:
          RAKUTEN_RMS_SERVICE_SECRET_1: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_1 }}
          RAKUTEN_RMS_LICENSE_KEY_1: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_1 }}
          RAKUTEN_SHOP_NAME_1: ${{ secrets.RAKUTEN_SHOP_NAME_1 }}
          MODE: ${{ inputs.mode }}
          COUPON_CODE: ${{ inputs.coupon_code }}
          HITS: ${{ inputs.hits }}
          NEW_START: ${{ inputs.new_start }}
          NEW_END: ${{ inputs.new_end }}
        run: python -u rakuten_coupon_test.py
