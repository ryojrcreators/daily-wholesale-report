name: 仕入不可商品 自動Close/再開（楽天・Yahoo）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（true = 何も変更せず対象の確認だけ）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      max_per_run:
        description: '1回で処理する最大件数'
        required: true
        default: '3'
      only_item_numbers:
        description: 'テスト用：この商品管理番号だけ対象にする（カンマ区切りで複数可）'
        required: false
        default: ''
      restock_quantity:
        description: '再開時にYahooへ設定する在庫数'
        required: false
        default: '100'

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 仕入不可商品 自動Close/再開実行
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_PER_RUN: ${{ inputs.max_per_run }}
          ONLY_ITEM_NUMBERS: ${{ inputs.only_item_numbers }}
          RESTOCK_QUANTITY: ${{ inputs.restock_quantity }}
          # 赤字チェックシート
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          RAKUTEN_SPREADSHEET_ID: ${{ secrets.RAKUTEN_SPREADSHEET_ID }}
          # case_orders_auto_close.py の再利用に必要な環境変数
          LOGIN_ID_1: ${{ secrets.LOGIN_ID_1 }}
          LOGIN_PASS_1: ${{ secrets.LOGIN_PASS_1 }}
          LOGIN_ID_2: ${{ secrets.LOGIN_ID_2 }}
          LOGIN_PASS_2: ${{ secrets.LOGIN_PASS_2 }}
          RAKUTEN_RMS_SERVICE_SECRET_1: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_1 }}
          RAKUTEN_RMS_LICENSE_KEY_1: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_1 }}
          RAKUTEN_SHOP_NAME_1: ${{ secrets.RAKUTEN_SHOP_NAME_1 }}
          RAKUTEN_RMS_SERVICE_SECRET_2: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_2 }}
          RAKUTEN_RMS_LICENSE_KEY_2: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_2 }}
          RAKUTEN_SHOP_NAME_2: ${{ secrets.RAKUTEN_SHOP_NAME_2 }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_SHOP_NAME_1: ${{ secrets.YAHOO_SHOP_NAME_1 }}
          YAHOO_SELLER_ID_1: ${{ secrets.YAHOO_SELLER_ID_1 }}
          YAHOO_SHOP_NAME_2: ${{ secrets.YAHOO_SHOP_NAME_2 }}
          YAHOO_SELLER_ID_2: ${{ secrets.YAHOO_SELLER_ID_2 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          RAKUTEN_LISTING_SPREADSHEET_ID: ${{ secrets.RAKUTEN_LISTING_SPREADSHEET_ID }}
          # 仕入れ可能に戻った際のChatwork通知に必要
          CW_TOKEN: ${{ secrets.CW_TOKEN }}
        run: python -u rakuten_shortage_auto_close.py
