name: ガイドライン変更 該当商品スキャン

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 実行
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          RAKUTEN_LISTING_SPREADSHEET_ID: ${{ secrets.RAKUTEN_LISTING_SPREADSHEET_ID }}
          WOWMA_API_KEY: ${{ secrets.WOWMA_API_KEY }}
          WOWMA_SHOP_ID: ${{ secrets.WOWMA_SHOP_ID }}
        run: python guideline_ban_scan.py
