name: 在庫日数アラート(DrP119) → Chatwork通知
on:
  schedule:
    - cron: '0 0 */4 * *'   # 4日おき（月初から1,5,9…日）UTC 0:00 = 日本時間 9:00
  workflow_dispatch:

permissions:
  contents: write   # 通知済み状態ファイルをコミットするため

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: 在庫日数チェック & Chatwork通知
        env:
          LOGIN_ID_1: ${{ secrets.LOGIN_ID_1 }}
          LOGIN_PASS_1: ${{ secrets.LOGIN_PASS_1 }}
          LOGIN_ID_2: ${{ secrets.LOGIN_ID_2 }}
          LOGIN_PASS_2: ${{ secrets.LOGIN_PASS_2 }}
          CW_TOKEN: ${{ secrets.CW_TOKEN }}
        run: python stock_days_alert.py

      - name: 状態ファイルを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_days_alert_state.json
          git diff --cached --quiet || (git commit -m "stock alert state" && git push)
