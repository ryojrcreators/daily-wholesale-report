name: 一時_タブ一覧確認
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth
      - name: タブ一覧
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          RAKUTEN_LISTING_SPREADSHEET_ID: ${{ secrets.RAKUTEN_LISTING_SPREADSHEET_ID }}
        run: |
          python -c "
          import os, json, gspread
          from google.oauth2.service_account import Credentials
          creds = Credentials.from_service_account_info(json.loads(os.environ['GOOGLE_CREDENTIALS']), scopes=['https://www.googleapis.com/auth/spreadsheets'])
          gc = gspread.authorize(creds)
          ss = gc.open_by_key(os.environ['RAKUTEN_LISTING_SPREADSHEET_ID'])
          print('スプレッドシートタイトル:', ss.title)
          print('タブ一覧:')
          for ws in ss.worksheets():
              print(' -', ws.title)
          "
