name: 一時：Keepaプラン確認

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 確認
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
        run: python -u _check_keepa_plan.py
