name: 楽天 仕入不可 自動販売停止

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（true = 実際には停止せず対象を確認するだけ）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      max_per_run:
        description: '1回で処理する最大件数'
        required: true
        default: '50'

jobs:
  suspend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 自動販売停止実行
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          RAKUTEN_SPREADSHEET_ID: ${{ secrets.RAKUTEN_SPREADSHEET_ID }}
          RAKUTEN_RMS_SERVICE_SECRET_1: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_1 }}
          RAKUTEN_RMS_LICENSE_KEY_1: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_1 }}
          RAKUTEN_SHOP_NAME_1: ${{ secrets.RAKUTEN_SHOP_NAME_1 }}
          RAKUTEN_RMS_SERVICE_SECRET_2: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_2 }}
          RAKUTEN_RMS_LICENSE_KEY_2: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_2 }}
          RAKUTEN_SHOP_NAME_2: ${{ secrets.RAKUTEN_SHOP_NAME_2 }}
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_PER_RUN: ${{ inputs.max_per_run }}
        run: python rakuten_auto_suspend.py
