name: Case Orders 自動Close（楽天・Yahoo）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（true = 何も変更せず対象の確認だけ）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      max_per_run:
        description: '1回で処理する最大ケース数'
        required: true
        default: '20'
  schedule:
    # 太平洋時間（PT）9:00〜19:00に1時間おき。本番実行（DRY_RUN=false）。
    # GitHub Actionsのcronはサマータイムを自動追従しないため、現在（PDT、UTC-7）基準で設定。
    # PDT 9:00〜19:00 = UTC 16:00〜翌2:00。冬時間（PST、UTC-8）に切り替わったら要調整。
    - cron: '0 16-23 * * *'
    - cron: '0 0-2 * * *'

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium || sudo apt-get install -y \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxshmfence1

      - name: 自動Close実行
        env:
          LOGIN_ID_1: ${{ secrets.LOGIN_ID_1 }}
          LOGIN_PASS_1: ${{ secrets.LOGIN_PASS_1 }}
          LOGIN_ID_2: ${{ secrets.LOGIN_ID_2 }}
          LOGIN_PASS_2: ${{ secrets.LOGIN_PASS_2 }}
          RAKUTEN_RMS_SERVICE_SECRET_1: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_1 }}
          RAKUTEN_RMS_LICENSE_KEY_1: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_1 }}
          RAKUTEN_SHOP_NAME_1: ${{ secrets.RAKUTEN_SHOP_NAME_1 }}
          RAKUTEN_RMS_SERVICE_SECRET_2: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_2 }}
          RAKUTEN_RMS_LICENSE_KEY_2: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_2 }}
          RAKUTEN_SHOP_NAME_2: ${{ secrets.RAKUTEN_SHOP_NAME_2 }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_SHOP_NAME_1: ${{ secrets.YAHOO_SHOP_NAME_1 }}
          YAHOO_SELLER_ID_1: ${{ secrets.YAHOO_SELLER_ID_1 }}
          YAHOO_SHOP_NAME_2: ${{ secrets.YAHOO_SHOP_NAME_2 }}
          YAHOO_SELLER_ID_2: ${{ secrets.YAHOO_SELLER_ID_2 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          RAKUTEN_LISTING_SPREADSHEET_ID: ${{ secrets.RAKUTEN_LISTING_SPREADSHEET_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '20' }}
        run: python -u case_orders_auto_close.py

      - name: デバッグ用スクリーンショット保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: |
            *.png
            *.html
          if-no-files-found: ignore
