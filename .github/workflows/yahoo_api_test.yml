name: Yahoo API テスト

on:
  workflow_dispatch:
    inputs:
      item_code:
        description: '調査対象のYahoo商品コード（ItemCode）'
        required: true
      mode:
        description: 'dump=読み取りのみ / hide=出品停止を試す / restore=元に戻す / publish=実店舗へ反映'
        required: true
        default: 'dump'
        type: choice
        options:
          - 'dump'
          - 'hide'
          - 'restore'
          - 'publish'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Yahoo APIテスト実行
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_SHOP_NAME_1: ${{ secrets.YAHOO_SHOP_NAME_1 }}
          YAHOO_SELLER_ID_1: ${{ secrets.YAHOO_SELLER_ID_1 }}
          YAHOO_SHOP_NAME_2: ${{ secrets.YAHOO_SHOP_NAME_2 }}
          YAHOO_SELLER_ID_2: ${{ secrets.YAHOO_SELLER_ID_2 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          RAKUTEN_LISTING_SPREADSHEET_ID: ${{ secrets.RAKUTEN_LISTING_SPREADSHEET_ID }}
          TARGET_ITEM_CODE: ${{ inputs.item_code }}
          MODE: ${{ inputs.mode }}
        run: python yahoo_api_test.py
