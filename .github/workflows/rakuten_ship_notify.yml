name: 楽天 出荷通知 自動反映

on:
  schedule:
    # 日本時間 9:30 / 13:30 / 17:30 に実行（UTC表記）
    - cron: '30 0 * * *'   # JST 9:30
    - cron: '30 4 * * *'   # JST 13:30
    - cron: '30 8 * * *'   # JST 17:30
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'DRY RUN（true = updateOrderShippingを呼ばない）'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      lookback_days:
        description: '当日を含め何日分を対象にするか'
        required: false
        default: '3'
      cw_room_id:
        description: 'Chatwork報告先ルームid（テスト時は本番以外を指定）'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ライブラリをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium || sudo apt-get install -y \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxshmfence1
      - name: 出荷通知自動反映
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          LOGIN_ID_1: ${{ secrets.LOGIN_ID_1 }}
          LOGIN_PASS_1: ${{ secrets.LOGIN_PASS_1 }}
          LOGIN_ID_2: ${{ secrets.LOGIN_ID_2 }}
          LOGIN_PASS_2: ${{ secrets.LOGIN_PASS_2 }}
          RAKUTEN_RMS_SERVICE_SECRET_1: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_1 }}
          RAKUTEN_RMS_LICENSE_KEY_1: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_1 }}
          RAKUTEN_RMS_SERVICE_SECRET_2: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_2 }}
          RAKUTEN_RMS_LICENSE_KEY_2: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_2 }}
          CW_TOKEN: ${{ secrets.CW_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
          CW_ROOM_ID: ${{ inputs.cw_room_id }}
        run: python -u rakuten_ship_notify.py

      - name: デバッグ用スクリーンショット保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: |
            *.png
            *.html
          if-no-files-found: ignore
