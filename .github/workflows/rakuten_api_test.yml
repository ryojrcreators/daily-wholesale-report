name: 楽天RMS API テスト

on:
  workflow_dispatch:
    inputs:
      target_manage_number:
        description: '対象の商品管理番号'
        required: true
      mode:
        description: 'get=商品情報を取得するだけ（読み取り専用） / hide=実際に商品を非公開にする（本番データ変更）'
        required: true
        default: 'get'
        type: choice
        options:
          - 'get'
          - 'hide'
      confirm:
        description: '⚠️ MODE=hide を実行する場合のみ、確認のため "HIDE" と正確に入力してください'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: APIテスト実行
        env:
          RAKUTEN_RMS_SERVICE_SECRET_1: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_1 }}
          RAKUTEN_RMS_LICENSE_KEY_1: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_1 }}
          RAKUTEN_SHOP_NAME_1: ${{ secrets.RAKUTEN_SHOP_NAME_1 }}
          RAKUTEN_RMS_SERVICE_SECRET_2: ${{ secrets.RAKUTEN_RMS_SERVICE_SECRET_2 }}
          RAKUTEN_RMS_LICENSE_KEY_2: ${{ secrets.RAKUTEN_RMS_LICENSE_KEY_2 }}
          RAKUTEN_SHOP_NAME_2: ${{ secrets.RAKUTEN_SHOP_NAME_2 }}
          TARGET_MANAGE_NUMBER: ${{ inputs.target_manage_number }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: python rakuten_api_test.py
